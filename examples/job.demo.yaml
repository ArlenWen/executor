version: 1
name: "demo"
description: "a demo job that contains all usage"
depends: # dependent jobs
  - job: "demo_job"  # demo_job.yaml in the same directory as this job file
  - job: "../another/demo_job2" # reference demo_job2.yaml in the "another" directory next to this job file
vars: # variable definitions; secrets cannot be defined here
  demo_var1: "asdfghjkl"
  demo_var2: 12345678
targets:  # target hosts on which actions run
  debian:
    protocol: ssh
    host: 192.168.2.130
    user: arlen
    password: ${secret.debian_password}
    port: 22
    ssh_key: ${secret.debian_ssh_key} # optional ssh auth method
  ubuntu:
    protocol: ssh
    host: 192.168.2.130
    user: arlen
    password: ${secret.ubuntu_password}
    port: 22
    ssh_key: ${secret.ubuntu_ssh_key} # optional ssh auth method
persistence: # result persistence; omit to disable persistence
  - local: "./persistence/"
    on_failure: false # optional; whether to persist finished results when the job fails, default true
  - mongodb:
      uri: "mongodb://localhost:27017/"
      database: "test"
      collection: "test"
      username: "test"
      password: "test"
      ssl: false
actions: # run the following actions sequentially
  - concurrency: # run the following actions concurrently
      - action:
          name: "bash"
          params:
              command: "ls -la"
          targets:
            - debian
          timeout: 10  # unit is seconds
          failed: skip
      - action:
          name: "bash"
          params:
            command: "find ~ | grep Download"
          targets:
            - ubuntu
          timeout: 10
          failed: skip
          retry:
            times: 3
            interval: 5
  - action:
      name: "bash"
      params:
        command: "cat ~/.bashrc"
      failed: skip
      targets:
        - debian
        - ubuntu
  - action:
      name: mysqlcli
      params:
        command: "select * from mysql.user;"
        database: mysql
        user: root
        password: ${secret.mysql_password}
        host: 127.0.0.1
        port: 3306
        ssl: false
      timeout: 3
      retry:
        times: 3
        interval: 5
      failed: skip  # skip or exit when action exec failed
  - action:
      name: "bash"
      params:
        command: "echo \"demo_var1 is ${demo_var1}, demo_var2 is ${demo_var2}\""
      targets:
        - debian
      failed: exit
