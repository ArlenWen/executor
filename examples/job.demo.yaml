version: 1
name: "demo"
description: "a demo job that contains all usage"
depends: # dependent jobs
  - job: "demo_job"  # demo_job.yaml in the same directory as this job file
  - job: "../another/demo_job2" # reference demo_job2.yaml in the "another" directory next to this job file
vars: # variable definitions; secrets cannot be defined here
  demo_var1: "asdfghjkl"
  demo_var2: 12345678
targets:  # target hosts on which actions run
  debian:
    protocol: ssh
    host: 192.168.2.130
    user: arlen
    password: ${secret.debian_password}
    port: 22
    ssh_key: ${secret.debian_ssh_key} # optional ssh auth method
  ubuntu:
    protocol: ssh
    host: 192.168.2.130
    user: arlen
    password: ${secret.ubuntu_password}
    port: 22
    ssh_key: ${secret.ubuntu_ssh_key} # optional ssh auth method
persistence: # result persistence; omit to disable persistence
  - local: "./persistence/"
    on_failure: false # optional; whether to persist finished results when the job fails, default true
  - mongodb:
      uri: "mongodb://localhost:27017/"
      database: "test"
      collection: "test"
      username: "test"
      password: "test"
      ssl: false
notify: # job result notification; omit to disable notification
  - email:
      to: ["<EMAIL>"]  # a string or a list of strings
      from: "<EMAIL>"
      subject: "job demo finished"
      body: "job demo finished, result ${result}"  # supports ${var} / ${secret.xxx} / ${result} / ${status} / ${job_id} / ${job_name}
      # smtp_* optional except smtp_host (required); all smtp config must be defined here in the job
      smtp_host: "smtp.example.com"
      smtp_port: 465
      smtp_user: "<EMAIL>"
      smtp_password: ${secret.smtp_password}
      smtp_ssl: true
  - webhook:
      url: "http://localhost:8080/webhook"
      method: "post" # optional; default post
      # headers: # optional
      #   Authorization: "Bearer xxx"
  - kafka:
      topic: "test"
      broker: "localhost:9092" # a string or a list of strings
  - rabbitmq:
      queue: "executor"
      # host: "localhost"       # optional; default localhost
      # port: 5672              # optional; default 5672
      # username: "guest"       # optional
      # password: ${secret.rabbitmq_password}  # optional
      # virtual_host: "/"       # optional; default /
actions: # run the following actions sequentially
  - concurrency: # run the following actions concurrently
      - action:
          name: "bash"
          params:
              command: "ls -la"
          targets:
            - debian
          timeout: 10  # unit is seconds
          failed: skip
      - action:
          name: "bash"
          params:
            command: "find ~ | grep Download"
          targets:
            - ubuntu
          timeout: 10
          failed: skip
          retry:
            times: 3
            interval: 5
  - action:
      name: "bash"
      params:
        command: "cat ~/.bashrc"
      failed: skip
      targets:
        - debian
        - ubuntu
  - action:
      name: mysqlcli
      params:
        command: "select * from mysql.user;"
        database: mysql
        user: root
        password: ${secret.mysql_password}
        host: 127.0.0.1
        port: 3306
        ssl: false
      timeout: 3
      retry:
        times: 3
        interval: 5
      failed: skip  # skip or exit when action exec failed
  - build-in:
      - name: "sleep"
        params:
          seconds: 5
      - name: "format"
        params:
          string: "job finished at ${time.now}"
          save_as: "finished_at_str"  # save into vars
      - name: "getter"
        params:
          value_from: "${vars.finished_at_str}"
          value_getter: "" # support a.b.c means dict['a']['b']['c'] or string regex
          save_as: "demo_save_as_var"
  - action:
      name: "bash"
      params:
        command: "echo \"demo_var1 is ${demo_var1}, demo_var2 is ${demo_var2}\""
      targets:
        - debian
      failed: exit
