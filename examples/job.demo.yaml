version: 1
name: "demo"
description: "a demo job that contains all usage"
depends: # 依赖的jobs
  - job: "demo_job"  # 当前job文件目录下的demo_job.yaml
  - job: "../another/demo_job2" # 引用当前job文件父目录下another目录的demo_job2yaml
vars: # 定义变量, 不能定义secret
  demo_var1: "asdfghjkl"
  demo_var2: 12345678
targets:  # 定义action执行的目标主机
  debian:
    protocol: ssh
    host: 192.168.2.130
    user: arlen
    password: ${secret.debian_password}
    port: 22
    ssh_key: ${secret.debian_ssh_key} # 可选的ssh验证方式
  ubuntu:
    protocol: ssh
    host: 192.168.2.130
    user: arlen
    password: ${secret.ubuntu_password}
    port: 22
    ssh_key: ${secret.ubuntu_ssh_key} # 可选的ssh验证方式
persistence: # 持久化存储，不定义则表示不持久化
  - local: "./persistence/"
  - mongodb:
      uri: "mongodb://localhost:27017/"
      database: "test"
      collection: "test"
      username: "test"
      password: "test"
      ssl: false
actions: # 顺序执行以下定义的action
  - concurrency: # 并发执行以下定义的actions
      - action:
          name: "bash"
          params:
              command: "ls -la"
          targets:
            - debian
          timeout: 10  # 默认单位为秒
      - action:
          name: "bash"
          params:
            command: "find ~ | grep Download"
          targets:
            - ubuntu
          timeout: 10
          retry:
            times: 3
            interval: 5
  - action:
      name: "bash"
      params:
        command: "cat ~/.bashrc"
      targets:
        - debian
        - ubuntu
  - action:
      name: mysqlcli
      params:
        command: "select * from mysql.user;"
        database: mysql
        user: root
        password: ${secret.mysql_password}
        host: 127.0.0.1
        port: 3306
        ssl: false
      timeout: 3
      retry:
        times: 3
        interval: 5
  - action:
      name: "bash"
      params:
        command: "echo \"demo_var1 is ${demo_var1}, demo_var2 is ${demo_var2}\""
      targets:
        - debian
